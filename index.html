<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atef Tech Gadgets</title>
  <meta name="description" content="Keyboards, mice and gear — curated tech gadgets." />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-theme="light">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" id="brand-link">
        <img src="assets/img/favicon.svg" alt="" class="brand-logo" />
        <span class="brand-name" id="brand-name">Atef Tech Gadgets</span>
      </a>
      <p class="tagline" id="brand-tagline"></p>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="Search products…" aria-label="Search products" />
      </div>
      <select id="sort-select" aria-label="Sort products">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="discount">Biggest Discount</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="category-nav" aria-label="Categories">
        <p class="sidebar-title">Categories</p>
        <ul id="category-list"></ul>
      </nav>
    </aside>

    <main class="content">
      <div id="active-filters" class="active-filters" hidden></div>
      <p id="result-count" class="result-count"></p>
      <div id="product-grid" class="product-grid" aria-live="polite"></div>
      <div id="empty-state" class="empty-state" hidden>
        <p>No products match your filters.</p>
        <button id="clear-filters">Clear filters</button>
      </div>
      <div id="loading-state" class="loading-state">Loading catalog…</div>
    </main>
  </div>

  <div id="product-modal" class="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div id="footer-contact"></div>
    <p class="footer-note">Catalog for browsing only — reach out to place an order.</p>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
